<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共同小説サイト</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
</head>
<body>
    <h1>共同で物語をつむぐ</h1>
    
    <div id="auth-status" style="margin-bottom: 20px; font-weight: bold;">認証状態を確認中...</div>
    
    <div id="story-container">
        <p class="story-part">物語の始まりです。誰かが続きを書くのを待っています。</p>
    </div>

    <hr>

    <div id="post-section">
        <h2>物語の続きを投稿</h2>
        <textarea id="new-part" placeholder="ここに続きの文章を入力してください..." rows="6"></textarea>
        <button id="post-button" disabled>投稿する</button> 
        <p class="note">
            ※ 投稿にはログインが必要です。
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
