<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共同小説サイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>共同で物語をつむぐ</h1>
    
    <div id="story-container">
        <p class="story-part">物語の始まりです。誰かが続きを書くのを待っています。</p>
    </div>

    <hr>

    <div id="post-section">
        <h2>物語の続きを投稿</h2>
        <textarea id="new-part" placeholder="ここに続きの文章を入力してください..." rows="6"></textarea>
        <button id="post-button">投稿する</button>
        <p class="note">
            ※ **[重要]** 実際には、この投稿はサーバー経由でデータベースに保存されます。<br>
            このデモでは、画面上での追加のみを行います。
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
